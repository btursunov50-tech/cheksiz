<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Neon VAQT gavdasi: minglab ingichka ko'k neon tolalardan to'qilgan baland chopon kiygan siymo, ko'kragida qum soati.
// Fon shaffof (ustma-ust qo'yish uchun). URL: #enter (tepadan pastga to'qilib paydo bo'ladi), #warm (ko'kdan oltinga o'tib so'nadi).
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920,CX=540;
const MODE=location.hash.slice(1);
// gavda chegarasi: y → yarim kenglik (yelka, yeng, chopon etagi kengayadi)
const KY=[455,480,530,610,800,1040,1110,1400,1820],KW=[58,105,205,228,226,218,172,215,285];
const half=y=>{if(y<=KY[0])return KW[0];for(let i=1;i<KY.length;i++)if(y<=KY[i]){const u=(y-KY[i-1])/(KY[i]-KY[i-1]);const s=u*u*(3-2*u);return KW[i-1]+(KW[i]-KW[i-1])*s;}return KW[KW.length-1];};
let s=11;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const N=120,strands=[];for(let i=0;i<N;i++)strands.push({u:(i+R()*.8)/N*2-1,ph:R()*6.28,sp:.6+R()*.8,a:.25+R()*.45,y0:455+R()*70,len:1+R()*.12});
const SP=[];for(let i=0;i<110;i++)SP.push({k:Math.floor(R()*N),o:R(),v:.06+R()*.1});
const FB=[];for(let i=0;i<70;i++)FB.push({u:R()*2-1,o:R(),v:.08+R()*.12,ph:R()*6.28});
const HEAD=[];for(let i=0;i<34;i++)HEAD.push({r:.75+R()*.3,rot:(R()-.5)*.5,ph:R()*6.28});
function col(w,a){// w: 0 ko'k → 1 oltin
 const r=Math.round(95+(255-95)*w),g=Math.round(212+(195-212)*w),b=Math.round(255+(77-255)*w);return `rgba(${r},${g},${b},${a})`;}
function strandPath(st,t,reveal){const p=[];const yEnd=Math.min(1820*st.len,1880);const y1=st.y0+(yEnd-st.y0)*reveal;
 for(let y=st.y0;y<=y1;y+=14){const hw=half(y);const amp=4+18*Math.pow((y-440)/1400,1.6);
  const xx=CX+st.u*hw+Math.sin(y*.012+t*st.sp+st.ph)*amp+Math.sin(y*.031-t*.7+st.ph*2)*amp*.35;p.push([xx,y]);}
 return p;}
window.setT=function(t){x.clearRect(0,0,W,H);s=11;
 const reveal=MODE==='enter'?Math.min(1,Math.max(0,(t-.2)/2.2)):1;
 const warm=MODE==='warm'?Math.min(1,Math.max(0,(t-1)/3)):0;
 const fade=MODE==='warm'?1-Math.min(1,Math.max(0,(t-4.5)/2.5)):1;
 const breathe=1+.006*Math.sin(t*1.3);
 x.save();x.translate(CX,1000);x.scale(breathe,breathe);x.translate(-CX,-1000);x.globalCompositeOperation='lighter';x.lineCap='round';
 // tolalar: uch qatlam (keng xira porlash → o'rta → ingichka yorug')
 const paths=strands.map(st=>strandPath(st,t,reveal));
 for(const[lw,al,bl]of[[7,.08,0],[2.6,.22,0],[1.1,.85,0]]){x.lineWidth=lw;
  strands.forEach((st,i)=>{const p=paths[i];if(p.length<2)return;x.strokeStyle=col(warm,al*Math.min(1,st.a+(Math.abs(st.u)>.86?.6:0))*fade);x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let k=1;k<p.length;k++)x.lineTo(p[k][0],p[k][1]);x.stroke();});}
 // qalpoqli bosh: qalpoq konturi yelkagacha tushadi, ichida yuz ovali (ko'z, og'iz chizilmagan)
 const hr=Math.min(1,reveal*3),hc=col(warm,.95*hr*fade);
 x.lineWidth=2.6;x.strokeStyle=hc;x.shadowColor=col(warm,1);x.shadowBlur=18;
 x.beginPath();x.moveTo(CX-150,535);x.bezierCurveTo(CX-120,430,CX-110,250,CX,238);x.bezierCurveTo(CX+110,250,CX+120,430,CX+150,535);x.stroke();
 x.lineWidth=2;x.beginPath();x.ellipse(CX,372,52,74,0,0,Math.PI*2*hr);x.stroke();x.shadowBlur=0;
 for(let i=0;i<22;i++){const k=i/21,sw=Math.sin(t*.9+i)*3;x.strokeStyle=col(warm,.28*hr*fade);x.lineWidth=1.1;x.beginPath();
  x.moveTo(CX-150+k*20,535);x.bezierCurveTo(CX-118+k*30+sw,430,CX-104+k*40,262+k*6,CX,246+k*4);x.bezierCurveTo(CX+104-k*40,262+k*6,CX+118-k*30-sw,430,CX+150-k*20,535);x.stroke();}
 // yeng va gavda orasidagi chiziqlar, qo'llar
 for(const sg of[-1,1]){for(let j=0;j<5;j++){x.strokeStyle=col(warm,(j?.3:.85)*Math.min(1,reveal*1.6)*fade);x.lineWidth=j?1.2:2.2;x.beginPath();
   for(let y=560;y<=1090*Math.min(1,.5+reveal*.5);y+=12){const xx=CX+sg*(150+(y-560)*.03)+sg*j*4+Math.sin(y*.015+t+j)*3;y===560?x.moveTo(xx,y):x.lineTo(xx,y);}x.stroke();}
  const hx=CX+sg*205,hy=1080;x.fillStyle=col(warm,.28*reveal*fade);x.shadowColor=col(warm,1);x.shadowBlur=14;x.beginPath();x.ellipse(hx,hy,9,15,sg*.2,0,7);x.fill();x.shadowBlur=0;}
 // kamar (oltin, xira)
 x.strokeStyle=`rgba(255,200,100,${.35*reveal*fade})`;x.lineWidth=3;x.beginPath();x.moveTo(CX-160,1000);x.quadraticCurveTo(CX,1018,CX+160,1000);x.stroke();
 // ko'krakdagi qum soati
 const gx=CX,gy=720,ga=Math.min(1,reveal*1.5)*fade;
 x.shadowColor=col(1,1);x.shadowBlur=30;x.strokeStyle=`rgba(255,215,130,${.95*ga})`;x.lineWidth=3;x.beginPath();
 x.moveTo(gx-46,gy-62);x.lineTo(gx+46,gy-62);x.lineTo(gx+6,gy);x.lineTo(gx+46,gy+62);x.lineTo(gx-46,gy+62);x.lineTo(gx-6,gy);x.closePath();x.stroke();
 x.fillStyle=`rgba(255,195,77,${.5*ga})`;x.beginPath();x.moveTo(gx-40,gy+58);x.lineTo(gx+40,gy+58);x.lineTo(gx,gy+20);x.fill();
 for(let i=0;i<10;i++){const yy=gy+((i*9+t*70)%58);x.fillStyle=`rgba(255,225,150,${ga})`;x.beginPath();x.arc(gx,yy,1.8,0,7);x.fill();}
 x.shadowBlur=0;
 // tolalar bo'ylab oqadigan oltin uchqunlar
 for(const sp of SP){const p=paths[sp.k];if(p.length<2)continue;const idx=Math.floor(((sp.o+t*sp.v)%1)*(p.length-1));const q=p[idx];
  x.fillStyle=`rgba(255,205,100,${.9*fade})`;x.shadowColor='rgba(255,195,77,1)';x.shadowBlur=14;x.beginPath();x.arc(q[0],q[1],2.6,0,7);x.fill();}
 x.shadowBlur=0;
 // etakdan uzilib havoga uchadigan tolachalar
 if(reveal>=1)for(const f of FB){const ph=(f.o+t*f.v)%1;const y=1800-ph*500,xx=CX+f.u*290*(1+ph*.4)+Math.sin(t*1.5+f.ph)*30*ph;
  x.strokeStyle=col(warm,.6*(1-ph)*fade);x.lineWidth=1.2;x.beginPath();x.moveTo(xx,y);x.lineTo(xx+Math.sin(f.ph+t)*14,y-30);x.stroke();}
 x.restore();};
setT(3);
</script></body></html>
