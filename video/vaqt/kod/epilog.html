<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#140c07}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Epilog kartasi: ko'k neon chiziq telefon chizadi, ichida «Kun maslahati»; ostida kanal va bot havolasi. setT(t), 7.8 s.
const c=document.getElementById('c'),x=c.getContext('2d'),W=1080,H=1920,CX=540;
const E=u=>u<0?0:u>1?1:u*u*(3-2*u);
let s=5;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const grain=[];for(let i=0;i<1400;i++)grain.push([R()*W,R()*H,R()]);
const SP=[];for(let i=0;i<70;i++)SP.push([R(),R(),.3+R()*.7]);
function rr(x0,y0,w,h,r){x.beginPath();x.moveTo(x0+r,y0);x.arcTo(x0+w,y0,x0+w,y0+h,r);x.arcTo(x0+w,y0+h,x0,y0+h,r);x.arcTo(x0,y0+h,x0,y0,r);x.arcTo(x0,y0,x0+w,y0,r);x.closePath();}
function neon(col,w,a){for(const[lw,al,bl]of[[w*5,.15,30],[w*2,.4,14],[w,1,4]]){x.strokeStyle=col;x.globalAlpha=al*a;x.lineWidth=lw;x.shadowColor=col;x.shadowBlur=bl;x.stroke();}x.globalAlpha=1;x.shadowBlur=0;}
function txt(t,y,size,col,a,glow){x.globalAlpha=a;x.font=`800 ${size}px Manrope, Arial, sans-serif`;x.textAlign='center';x.fillStyle=col;x.shadowColor=glow||col;x.shadowBlur=24;x.fillText(t,CX,y);x.shadowBlur=0;x.globalAlpha=1;}
const L={uz:['KUN MASLAHATI','Har tong bepul AI maslahati',"Savolingiz bo'lsa:"],
 en:['TIP OF THE DAY','A free AI tip every morning','Got a question?'],
 ru:['СОВЕТ ДНЯ','Каждое утро бесплатный совет по ИИ','Есть вопрос?']}[location.hash.slice(1)||'uz'];
window.setT=function(t){
 x.fillStyle='#140c07';x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(CX,760,80,CX,760,1100);g.addColorStop(0,'#3a2414');g.addColorStop(1,'#0d0704');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,220,170,.035)';for(const[a,b,r]of grain)x.fillRect(a,b,1+r*2,1+r*2);
 // telefon konturi chiziladi (0–1.4 s)
 const d=E(t/1.4);x.setLineDash([2400*d,3000]);rr(330,230,420,780,56);neon('#5fd4ff',4,1);x.setLineDash([]);
 // ekran ichi
 const a1=E((t-1.2)/.6);
 txt(L[0],420,46,'#ffc34d',a1);
 x.globalAlpha=a1;x.strokeStyle='#5fd4ff';x.lineWidth=3;x.shadowColor='#5fd4ff';x.shadowBlur=14;
 for(let i=0;i<4;i++){const w=[300,260,280,200][i]*E((t-1.5-i*.15)/.5);x.beginPath();x.moveTo(CX-150,520+i*70);x.lineTo(CX-150+w,520+i*70);x.stroke();}
 x.shadowBlur=0;x.globalAlpha=1;
 txt('05:00',880,72,'#e8f8ff',E((t-2)/.6),'#5fd4ff');
 // ko'tarilib uchadigan uchqunlar
 for(const[u,v,sp]of SP){const p=((v+t*.12*sp)%1);const y=980-p*700,xx=360+u*360;x.globalAlpha=E((t-1)/1)*(1-p)*.9;x.fillStyle='#ffc34d';x.shadowColor='#ffc34d';x.shadowBlur=10;x.beginPath();x.arc(xx,y,2.4,0,7);x.fill();}
 x.globalAlpha=1;x.shadowBlur=0;
 // havolalar
 txt(L[1],1150,52,'#f3e8da',E((t-2.6)/.6),'#000');
 txt('t.me/infinite_ai_and_me',1235,58,'#5fd4ff',E((t-3)/.6));
 txt(L[2],1345,44,'#c0a98f',E((t-4.6)/.6),'#000');
 txt('@sahiychishopbot',1420,62,'#ffc34d',E((t-4.9)/.6));
};
setT(6);
</script></body></html>
