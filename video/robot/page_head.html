<title>Robot bilan choy sahnalari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: one column of scene cards, image above its prompt; a single dusk-choyxona look (deliberately dark). */
:root{--bg:#17110d;--card:#211812;--line:#3d2c20;--fg:#f3e8da;--muted:#c0a98f;--sun:#f0a14a;--chrome:#9fd3ef;
--display:"Lora",Georgia,serif;--body:"Manrope",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,40px);margin:0;text-wrap:balance}
.intro{color:var(--muted);margin:0;max-width:62ch}
.card{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.media img{width:100%;max-width:420px;border-radius:6px;display:block;margin:0 auto}
.txt{min-width:0;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:var(--mono);color:var(--sun);font-size:14px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
.dur{font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.voice{margin:0;font-style:italic}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;user-select:all}
.copy{align-self:flex-start;font:600 15px var(--body);color:var(--bg);background:var(--sun);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.copy.done{background:var(--chrome)}
.copy:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
<div class="wrap">
<h1>«Robot bilan bir piyola choy» sahnalari</h1>
<p class="intro">Har bir sahna: rasm, ovoz qatori va video prompti. «Nusxa olish»ni bosing, promptni shu rasm bilan birga Veo, Kling yoki Vidu'ga qo'ying. Format 9:16, 8 soniya. Ovozni o'zimiz qo'yamiz, video vositasidagi ovozga e'tibor bermang.</p>
