<style>
:root{
  --bg:#04101e; --bg2:#0a1a33; --card:#0f2142; --line:rgba(240,200,110,.22);
  --gold:#f0c86e; --gold2:#d9a441; --ink:#f3f6fb; --muted:#a9b6cc; --tg:#229ed9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
[dir=rtl] body{font-family:"Vazirmatn","Montserrat",system-ui,sans-serif}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Vazirmatn",system-ui,sans-serif}
html[lang=zh] body{font-family:"Noto Sans SC","Montserrat",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(4,16,30,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-family:"Montserrat",sans-serif;white-space:nowrap}
.brand .inf{color:var(--gold);font-size:1.6rem;line-height:1}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 12px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;max-width:170px}
[dir=rtl] .lang select{padding:9px 12px 9px 34px}
.lang::after{content:"▾";position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none}

/* hero */
.hero{position:relative;text-align:center;padding:24px 0 56px;background:radial-gradient(ellipse at 50% 0%,#0d2a52 0%,var(--bg) 70%)}
.hero-img{width:min(560px,100%);height:auto;aspect-ratio:900/400;object-fit:cover;margin:0 auto;display:block;-webkit-mask-image:radial-gradient(ellipse 62% 62% at 50% 50%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 62% 62% at 50% 50%,#000 45%,transparent 100%)}
.hero h1{font-family:"Montserrat",sans-serif;font-size:clamp(2.2rem,8vw,4rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:-6px}
.hero h1 .amp{color:var(--gold)}
.tagline{margin-top:12px;font-size:clamp(1.05rem,3.6vw,1.4rem);font-weight:700;background:linear-gradient(90deg,var(--gold),#fff2c9,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro{max-width:640px;margin:16px auto 0;color:var(--muted);font-size:1.02rem}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:14px;font-weight:700;font-size:1rem;border:1px solid transparent;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1203;box-shadow:0 8px 28px rgba(240,200,110,.25)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.03)}
.btn-tg{background:var(--tg);color:#fff;box-shadow:0 8px 28px rgba(34,158,217,.3)}
.btn svg{width:22px;height:22px;flex-shrink:0}

/* sections */
section{padding:56px 0}
h2{text-align:center;font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;margin-bottom:28px}
h2::after{content:"";display:block;width:56px;height:3px;border-radius:3px;margin:14px auto 0;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px}
.card .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:rgba(240,200,110,.12);border:1px solid var(--line);margin-bottom:14px}
.card h3{font-size:1.15rem;font-weight:700;margin-bottom:6px}
.card p{color:var(--muted);font-size:.96rem}

.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.step::before{counter-increment:s;content:counter(s);flex-shrink:0;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a1203;background:linear-gradient(135deg,var(--gold),var(--gold2));font-family:"Montserrat",sans-serif}
.step p{font-weight:600;padding-top:7px}

.video-box{max-width:380px;margin:0 auto;border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.video-box video{display:block;width:100%;height:auto;aspect-ratio:9/16}

.contact{text-align:center;background:radial-gradient(ellipse at 50% 100%,#0d2a52 0%,var(--bg) 70%)}
.contact p.lead{color:var(--muted);max-width:520px;margin:-8px auto 22px}
.qr{display:inline-block;margin-top:26px;background:#fff;border-radius:20px;padding:14px}
.qr img{display:block;width:200px;height:200px;image-rendering:pixelated}
.scan{margin-top:10px;color:var(--muted);font-size:.92rem}
.handle{margin-top:4px;font-weight:700;color:var(--gold);font-family:"Montserrat",sans-serif;direction:ltr;unicode-bidi:isolate}

footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:.9rem}
footer b{color:var(--ink)}

@media (max-width:520px){
  section{padding:44px 0}
  .btn{width:100%}
  .brand .txt{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>

tk:{tagline:"Siziň işiňiz + EA = çäksiz mümkinçilik",intro:"Biz adam we emeli aň toparydyrys. Siziň işiňiz üçin saýt, QR katalog we akylly Telegram bot döredýäris — müşderileriňiziň dilinde.",cta_bot:"Botumyza ýazyň",cta_services:"Hyzmatlarymyz",services_h:"Biz näme edýäris",s1t:"QR katalog saýty",s1d:"Ähli harytlaryňyz bir sahypada. Müşderi QR kody skanirleýär we hemmesini telefonynda görýär — programma gerek däl.",s2t:"Akylly Telegram bot",s2d:"Müşderilere gije-gündiz jogap berýär, gerekli harydy tapýar we sargydy göni size iberýär.",s3t:"Köp dilli",s3d:"Dari, puştu, özbek, rus, iňlis we beýleki diller — her müşderi öz dilinde okaýar.",s4t:"Çalt we arzan",s4d:"Birnäçe günde taýýar. Diňe gerek zadyňyz üçin töleýärsiňiz.",how_h:"Bu nähili işleýär",st1:"Baha sanawyňyzy ýa-da katalogyňyzy bize iberiň",st2:"Biz saýtyňyzy we botuňyzy döredýäris",st3:"QR kody çap ediň we täze müşderileri garşy alyň",video_h:"Wideomyza serediň",contact_h:"Saýt we bot sargyt ediň",contact_p:"Telegram botumyza ýazyň — derrew jogap berýär.",contact_btn:"Telegram boty açmak",scan:"ýa-da QR kody skanirläň",footer:"Saýtlar · QR kataloglar · Akylly botlar"},
az:{tagline:"Biznesiniz + Sİ = sonsuz imkanlar",intro:"Biz insan və süni intellekt komandasıyıq. Biznesiniz üçün sayt, QR kataloq və ağıllı Telegram bot yaradırıq — müştərilərinizin dilində.",cta_bot:"Botumuza yazın",cta_services:"Xidmətlərimiz",services_h:"Nə edirik",s1t:"QR kataloq saytı",s1d:"Bütün məhsullarınız bir səhifədə. Müştəri QR kodu skan edir və hər şeyi telefonunda görür — tətbiq lazım deyil.",s2t:"Ağıllı Telegram bot",s2d:"Müştərilərə 24/7 cavab verir, lazımi məhsulu tapır və sifarişi birbaşa sizə göndərir.",s3t:"Çoxdilli",s3d:"Dari, puştu, özbək, rus, ingilis və digər dillər — hər müştəri öz dilində oxuyur.",s4t:"Sürətli və münasib",s4d:"Bir neçə günə hazır olur. Yalnız ehtiyacınız olan üçün ödəyirsiniz.",how_h:"Necə işləyir",st1:"Qiymət siyahınızı və ya kataloqunuzu bizə göndərin",st2:"Biz saytınızı və botunuzu yaradırıq",st3:"QR kodu çap edin və yeni müştəriləri qarşılayın",video_h:"Videomuza baxın",contact_h:"Sayt və bot sifariş edin",contact_p:"Telegram botumuza yazın — dərhal cavab verir.",contact_btn:"Telegram botu açın",scan:"və ya QR kodu skan edin",footer:"Saytlar · QR kataloqlar · Ağıllı botlar"},
fa:{tagline:"کسب‌وکار شما + هوش مصنوعی = بی‌نهایت",intro:"ما یک تیم انسان و هوش مصنوعی هستیم. برای کسب‌وکار شما وب‌سایت، کاتالوگ QR و ربات هوشمند تلگرام می‌سازیم — به زبان مشتریان شما.",cta_bot:"به ربات ما پیام دهید",cta_services:"خدمات ما",services_h:"چه کاری انجام می‌دهیم",s1t:"وب‌سایت کاتالوگ QR",s1d:"همه محصولات شما در یک صفحه. مشتری کد QR را اسکن می‌کند و همه چیز را در گوشی خود می‌بیند — بدون نیاز به اپلیکیشن.",s2t:"ربات هوشمند تلگرام",s2d:"به‌صورت ۲۴ ساعته به مشتریان پاسخ می‌دهد، محصول مناسب را پیدا می‌کند و سفارش را مستقیم برای شما می‌فرستد.",s3t:"چندزبانه",s3d:"دری، پشتو، ازبکی، روسی، انگلیسی و زبان‌های دیگر — هر مشتری به زبان خودش می‌خواند.",s4t:"سریع و مقرون‌به‌صرفه",s4d:"ظرف چند روز آماده است. فقط برای آنچه نیاز دارید هزینه می‌کنید.",how_h:"چطور کار می‌کند",st1:"لیست قیمت یا کاتالوگ خود را برای ما بفرستید",st2:"ما وب‌سایت و ربات شما را می‌سازیم",st3:"کد QR را چاپ کنید و از مشتریان جدید استقبال کنید",video_h:"ویدیوی ما را ببینید",contact_h:"وب‌سایت و ربات سفارش دهید",contact_p:"به ربات تلگرام ما پیام دهید — فوراً پاسخ می‌دهد.",contact_btn:"باز کردن ربات تلگرام",scan:"یا کد QR را اسکن کنید",footer:"وب‌سایت · کاتالوگ QR · ربات هوشمند"},
ur:{tagline:"آپ کا کاروبار + مصنوعی ذہانت = لامحدود امکانات",intro:"ہم انسان اور مصنوعی ذہانت کی ٹیم ہیں۔ ہم آپ کے کاروبار کے لیے ویب سائٹ، QR کیٹلاگ اور اسمارٹ ٹیلیگرام بوٹ بناتے ہیں — آپ کے گاہکوں کی زبان میں۔",cta_bot:"ہمارے بوٹ کو پیغام بھیجیں",cta_services:"ہماری خدمات",services_h:"ہم کیا کرتے ہیں",s1t:"QR کیٹلاگ ویب سائٹ",s1d:"آپ کی تمام مصنوعات ایک صفحے پر۔ گاہک QR کوڈ اسکین کرتا ہے اور سب کچھ اپنے فون پر دیکھتا ہے — کسی ایپ کی ضرورت نہیں۔",s2t:"اسمارٹ ٹیلیگرام بوٹ",s2d:"گاہکوں کو 24/7 جواب دیتا ہے، صحیح پروڈکٹ تلاش کرتا ہے اور آرڈر سیدھا آپ کو بھیجتا ہے۔",s3t:"کئی زبانیں",s3d:"دری، پشتو، ازبک، روسی، انگریزی اور دیگر زبانیں — ہر گاہک اپنی زبان میں پڑھتا ہے۔",s4t:"تیز اور سستا",s4d:"چند دنوں میں تیار۔ صرف اسی کی ادائیگی کریں جس کی آپ کو ضرورت ہے۔",how_h:"یہ کیسے کام کرتا ہے",st1:"اپنی قیمتوں کی فہرست یا کیٹلاگ ہمیں بھیجیں",st2:"ہم آپ کی ویب سائٹ اور بوٹ بناتے ہیں",st3:"QR کوڈ پرنٹ کریں اور نئے گاہکوں کا استقبال کریں",video_h:"ہماری ویڈیو دیکھیں",contact_h:"ویب سائٹ اور بوٹ کا آرڈر دیں",contact_p:"ہمارے ٹیلیگرام بوٹ کو لکھیں — وہ فوراً جواب دیتا ہے۔",contact_btn:"ٹیلیگرام بوٹ کھولیں",scan:"یا QR کوڈ اسکین کریں",footer:"ویب سائٹس · QR کیٹلاگ · اسمارٹ بوٹس"},
kk:{tagline:"Сіздің бизнесіңіз + ЖИ = шексіз мүмкіндік",intro:"Біз — адам мен жасанды интеллект командасымыз. Бизнесіңіз үшін сайт, QR-каталог және ақылды Telegram-бот жасаймыз — клиенттеріңіздің тілінде.",cta_bot:"Ботымызға жазыңыз",cta_services:"Қызметтеріміз",services_h:"Біз не істейміз",s1t:"QR-каталог сайты",s1d:"Барлық тауарларыңыз бір бетте. Клиент QR-кодты сканерлеп, бәрін телефонынан көреді — қосымша қажет емес.",s2t:"Ақылды Telegram-бот",s2d:"Клиенттерге тәулік бойы жауап береді, керекті тауарды табады және тапсырысты тікелей сізге жібереді.",s3t:"Көптілді",s3d:"Дари, пушту, өзбек, орыс, ағылшын және басқа тілдер — әр клиент өз тілінде оқиды.",s4t:"Жылдам әрі арзан",s4d:"Бірнеше күнде дайын. Тек қажетіңіз үшін төлейсіз.",how_h:"Бұл қалай жұмыс істейді",st1:"Баға тізімін немесе каталогыңызды бізге жіберіңіз",st2:"Біз сайт пен бот жасаймыз",st3:"QR-кодты басып шығарып, жаңа клиенттерді қарсы алыңыз",video_h:"Бейнемізді көріңіз",contact_h:"Сайт пен ботқа тапсырыс беріңіз",contact_p:"Telegram-ботымызға жазыңыз — бірден жауап береді.",contact_btn:"Telegram-ботты ашу",scan:"немесе QR-кодты сканерлеңіз",footer:"Сайттар · QR-каталогтар · Ақылды боттар"},
ky:{tagline:"Сиздин бизнес + ЖИ = чексиз мүмкүнчүлүк",intro:"Биз адам жана жасалма интеллект командасыбыз. Бизнесиңиз үчүн сайт, QR-каталог жана акылдуу Telegram-бот түзөбүз — кардарларыңыздын тилинде.",cta_bot:"Ботубузга жазыңыз",cta_services:"Кызматтарыбыз",services_h:"Биз эмне кылабыз",s1t:"QR-каталог сайты",s1d:"Бардык товарларыңыз бир бетте. Кардар QR-кодду сканерлеп, баарын телефонунан көрөт — тиркеме керек эмес.",s2t:"Акылдуу Telegram-бот",s2d:"Кардарларга күнү-түнү жооп берет, керектүү товарды табат жана буйрутманы түз сизге жөнөтөт.",s3t:"Көп тилдүү",s3d:"Дари, пушту, өзбек, орус, англис жана башка тилдер — ар бир кардар өз тилинде окуйт.",s4t:"Тез жана арзан",s4d:"Бир нече күндө даяр. Керектүүсү үчүн гана төлөйсүз.",how_h:"Бул кантип иштейт",st1:"Баа тизмеңизди же каталогуңузду бизге жөнөтүңүз",st2:"Биз сайт жана бот түзөбүз",st3:"QR-кодду басып чыгарып, жаңы кардарларды тосуп алыңыз",video_h:"Видеобузду көрүңүз",contact_h:"Сайт жана бот буйрутма кылыңыз",contact_p:"Telegram-ботубузга жазыңыз — дароо жооп берет.",contact_btn:"Telegram-ботту ачуу",scan:"же QR-кодду сканерлеңиз",footer:"Сайттар · QR-каталогдор · Акылдуу боттор"},
kaa:{tagline:"Biznesińiz + JI = sheksiz múmkinshilik",intro:"Biz adam hám jasalma intellekt komandasımız. Biznesińiz ushın sayt, QR katalog hám aqıllı Telegram bot jaratamız — klientlerińizdiń tilinde.",cta_bot:"Botımızǵa jazıń",cta_services:"Xızmetlerimiz",services_h:"Biz ne isleymiz",s1t:"QR katalog sayt",s1d:"Barlıq ónimlerińiz bir bette. Klient QR kodtı skanerleydi hám hámmesin telefonında kóredi — qosımsha kerek emes.",s2t:"Aqıllı Telegram bot",s2d:"Klientlerge kún-tún juwap beredi, kerekli ónimdi tabadı hám buyırtpanı tikkeley sizge jiberedi.",s3t:"Kóp tilli",s3d:"Dari, pushtu, ózbek, orıs, inglis hám basqa tiller — hár bir klient óz tilinde oqıydı.",s4t:"Tez hám arzan",s4d:"Bir neshe kúnde tayın. Tek kereklisi ushın tóleysiz.",how_h:"Bul qalay isleydi",st1:"Baha dizimińizdi yamasa katalogıńızdı bizge jiberiń",st2:"Biz sayt hám bot jaratamız",st3:"QR kodtı basıp shıǵarıń hám jańa klientlerdi kútip alıń",video_h:"Videomızdı kóriń",contact_h:"Sayt hám bot buyırtpa beriń",contact_p:"Telegram botımızǵa jazıń — dárhal juwap beredi.",contact_btn:"Telegram bottı ashıw",scan:"yamasa QR kodtı skanerleń",footer:"Saytlar · QR kataloglar · Aqıllı botlar"},

function store(v){ try{ if(v===undefined) return localStorage.getItem("iam-lang"); localStorage.setItem("iam-lang",v); }catch(e){ return null; } }

function detect(){
  const p = new URLSearchParams(location.search).get("lang");
  if (p && T[p]) return p;
  const s = store(); if (s && T[s]) return s;
  for (const raw of (navigator.languages || [navigator.language || "en"])){
    const l = raw.toLowerCase();
    if (l.startsWith("fa-af") || l.startsWith("prs")) return "prs";
    const base = l.split("-")[0];
    if (T[base]) return base;
  }
  return "en";
}

function apply(lang){
  const t = T[lang] || T.en;
  const html = document.documentElement;
  html.lang = lang === "prs" ? "fa-AF" : lang;
  html.dir = RTL.includes(lang) ? "rtl" : "ltr";
  if (lang === "ur") html.lang = "ur";
  if (lang === "zh") html.lang = "zh";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i] || T.en[el.dataset.i]; });
  document.getElementById("lang").value = lang;
}

const sel = document.getElementById("lang");
LANGS.forEach(([code, name]) => { const o = document.createElement("option"); o.value = code; o.textContent = name; sel.appendChild(o); });
sel.addEventListener("change", () => { store(sel.value); apply(sel.value); });
apply(detect());
</script>
